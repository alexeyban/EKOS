name: Release

# RFC 0153 — build prebuilt `ekos` binaries for a tagged version and publish them as a GitHub
# Release. Tag-triggered and deliberate: nothing here runs on a merge to main.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# `workflow_dispatch` builds the artifacts without creating a release, for testing the matrix.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege, declared per job rather than once at the top. A workflow-level
# `contents: write` grants it to EVERY job — here that would have been the six build jobs and the
# verify job, none of which do anything but check out code. Only `release` needs write, and only
# because `gh release create` uploads the assets. A top-level `contents: read` also zeroes every
# other scope (packages, id-token, ...), so each job gets exactly what it asks for and no more.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Checkout only. Artifact upload uses the Actions runtime token, not GITHUB_TOKEN, so it
    # needs no permission entry here.
    permissions:
      contents: read
    strategy:
      # One broken target must not cancel the others: a release missing one platform is worth
      # more than no release at all, and the missing row is obvious in the artifact list.
      fail-fast: false
      matrix:
        include:
          # Pinned to the OLDEST supported runner, not `ubuntu-latest`, and this is load-bearing:
          # a glibc build only runs on glibc >= the one it was built against. Built on 24.04 it
          # required GLIBC_2.39 and would not start on Ubuntu 22.04, Debian 12 or RHEL 9 — which
          # is most machines in use. 22.04 gives a 2.35 baseline. Verified by the v1.0.0 release
          # failing to run on a 2.35 host; see devlog_201.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          # Fully static — runs on any glibc vintage, in Alpine, and in slim containers, so the
          # builder's own glibc is irrelevant here. This is also the fallback `install.sh` drops
          # to when the gnu build will not start.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            packages: musl-tools
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@v7

      # No `toolchain:` input — `rust-toolchain.toml` at the repository root pins the version,
      # and rustup honours it for every cargo invocation below.
      #
      # Deliberately no `targets:` input either. That installs the target into the toolchain the
      # *action* selects (stable), while every cargo command here runs under the toolchain the
      # file pins — so the cross targets had std for a toolchain nothing used, and the build died
      # with `can't find crate for 'core'`. Host-native targets were unaffected, which is why
      # four of six rows passed and only musl and x86_64-darwin failed. The target must be added
      # in the working directory, where the toolchain file applies.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install the pinned toolchain and add the target to it
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
          rustup target list --installed

      - name: Install cross-compilation packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ekos/target
          key: release-${{ matrix.target }}-${{ hashFiles('ekos/Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      # Default features only: the `distributed` feature pulls the whole object_store stack and
      # a stock build must never compile it (RFC 0113).
      #
      # `CC_x86_64_unknown_linux_musl`: the workspace compiles real C (bundled SQLite, zstd), and
      # cc-rs looks for `x86_64-linux-musl-gcc` when targeting musl. Ubuntu's `musl-tools` package
      # installs `musl-gcc` under that name and no other, so without this the musl row fails at
      # the C stage with `ToolNotFound` even once its std is present. Harmless on every other row:
      # the variable is target-scoped and nothing else reads it.
      - name: Build
        working-directory: ekos
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p ekos --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || version="dev"
          stage="ekos-${version}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp "ekos/target/${{ matrix.target }}/release/ekos" "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          if command -v shasum >/dev/null; then
            (cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256")
          else
            (cd dist && sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256")
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { 'dev' }
          $stage = "ekos-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "ekos/target/${{ matrix.target }}/release/ekos.exe" "dist/$stage/"
          Copy-Item README.md, LICENSE "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"
          $hash = (Get-FileHash "dist/$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Out-File -Encoding ascii "dist/$stage.zip.sha256"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ekos-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The only job in this workflow that writes anything: `gh release create` creates the release
    # and uploads its assets.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download every target's artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Build one SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob

          # `./*.sha256`, never a bare `*.sha256`: a file whose name begins with "-" would
          # otherwise be handed to cat/rm as an option (ShellCheck SC2035). Collected into arrays
          # and quoted so a name containing whitespace cannot split either.
          sums=(./*.sha256)
          archives=(./*.tar.gz ./*.zip)

          # Every archive must have contributed a checksum. Without this check a target whose
          # upload half-failed would still be attached to the release, and `install.sh` would
          # then refuse it at the verification step — "not listed in SHA256SUMS" — for a user,
          # after publication, rather than here.
          if [ "${#sums[@]}" -eq 0 ]; then
            echo "no per-target checksum files found in dist/" >&2
            ls -la >&2
            exit 1
          fi
          if [ "${#sums[@]}" -ne "${#archives[@]}" ]; then
            echo "checksum/archive mismatch: ${#sums[@]} checksums, ${#archives[@]} archives" >&2
            ls -la >&2
            exit 1
          fi

          # `sort` rather than `cat`: the glob order is locale-dependent, so this keeps SHA256SUMS
          # byte-identical when the same tag is rebuilt.
          sort "${sums[@]}" > SHA256SUMS
          rm -f "${sums[@]}"

          echo "Release contains ${#archives[@]} archives:"
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=CHANGELOG.md
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi

  verify:
    name: Verify install.sh
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # The point of this job: a release nobody can install must fail here, not in a user's
      # terminal. It installs the release that was just published, exactly as a reader would.
      - name: Install from the published release
        # No GH_TOKEN: `install.sh` authenticates nothing — it fetches public release assets with
        # plain curl — and EKOS_VERSION means it never even calls the API. Passing a token here
        # exposed a credential to a downloaded-and-executed script for no reason.
        env:
          EKOS_VERSION: ${{ github.ref_name }}
        run: sh ./install.sh

      - name: The binary runs and reports its version
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          ekos --version
          ekos --version | grep -qv '0\.0\.0'

      - name: It works on a real workspace
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/ws/db && cd /tmp/ws
          printf 'CREATE TABLE t (id SERIAL PRIMARY KEY);\n' > db/schema.sql
          ekos init --detect --dry-run | grep -q 'default-dialect = "postgres"'
