name: Release

# RFC 0153 — build prebuilt `ekos` binaries for a tagged version and publish them as a GitHub
# Release. Tag-triggered and deliberate: nothing here runs on a merge to main.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# `workflow_dispatch` builds the artifacts without creating a release, for testing the matrix.
# The same holds for the container image (RFC 0179): built on both, pushed to ghcr.io on a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege, declared per job rather than once at the top. A workflow-level
# `contents: write` grants it to EVERY job — here that would have been the six build jobs and the
# verify job, none of which do anything but check out code. Only `release` needs write, and only
# because `gh release create` uploads the assets. A top-level `contents: read` also zeroes every
# other scope (packages, id-token, ...), so each job gets exactly what it asks for and no more.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Checkout only. Artifact upload uses the Actions runtime token, not GITHUB_TOKEN, so it
    # needs no permission entry here.
    permissions:
      contents: read
    strategy:
      # One broken target must not cancel the others: a release missing one platform is worth
      # more than no release at all, and the missing row is obvious in the artifact list.
      fail-fast: false
      matrix:
        include:
          # Pinned to the OLDEST supported runner, not `ubuntu-latest`, and this is load-bearing:
          # a glibc build only runs on glibc >= the one it was built against. Built on 24.04 it
          # required GLIBC_2.39 and would not start on Ubuntu 22.04, Debian 12 or RHEL 9 — which
          # is most machines in use. 22.04 gives a 2.35 baseline. Verified by the v1.0.0 release
          # failing to run on a 2.35 host; see devlog_201.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          # Fully static — runs on any glibc vintage, in Alpine, and in slim containers, so the
          # builder's own glibc is irrelevant here. This is also the fallback `install.sh` drops
          # to when the gnu build will not start.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            packages: musl-tools
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          # macos-15 (Apple silicon). macos-14 jobs were cancelled within seconds, with no
          # runner assigned, from 2026-11-05: the image is no longer served.
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@v7

      # No `toolchain:` input — `rust-toolchain.toml` at the repository root pins the version,
      # and rustup honours it for every cargo invocation below.
      #
      # Deliberately no `targets:` input either. That installs the target into the toolchain the
      # *action* selects (stable), while every cargo command here runs under the toolchain the
      # file pins — so the cross targets had std for a toolchain nothing used, and the build died
      # with `can't find crate for 'core'`. Host-native targets were unaffected, which is why
      # four of six rows passed and only musl and x86_64-darwin failed. The target must be added
      # in the working directory, where the toolchain file applies.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install the pinned toolchain and add the target to it
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
          rustup target list --installed

      - name: Install cross-compilation packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ekos/target
          key: release-${{ matrix.target }}-${{ hashFiles('ekos/Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      # Default features only: the `distributed` feature pulls the whole object_store stack and
      # a stock build must never compile it (RFC 0113).
      #
      # `CC_x86_64_unknown_linux_musl`: the workspace compiles real C (bundled SQLite, zstd), and
      # cc-rs looks for `x86_64-linux-musl-gcc` when targeting musl. Ubuntu's `musl-tools` package
      # installs `musl-gcc` under that name and no other, so without this the musl row fails at
      # the C stage with `ToolNotFound` even once its std is present. Harmless on every other row:
      # the variable is target-scoped and nothing else reads it.
      #
      # `CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS`: link the C runtime statically on Windows,
      # so `ekos.exe` needs no `vcruntime140.dll` on the user's machine. That matters for the zip
      # and is required for the Microsoft Store package (the `msix` job below), which would
      # otherwise need a VCLibs framework dependency. cc-rs reads the same target feature and
      # compiles the bundled C (SQLite, zstd) with /MT to match. Target-scoped like the line above.
      - name: Build
        working-directory: ekos
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked -p ekos --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || version="dev"
          stage="ekos-${version}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp "ekos/target/${{ matrix.target }}/release/ekos" "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          if command -v shasum >/dev/null; then
            (cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256")
          else
            (cd dist && sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256")
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { 'dev' }
          $stage = "ekos-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "ekos/target/${{ matrix.target }}/release/ekos.exe" "dist/$stage/"
          Copy-Item README.md, LICENSE "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"
          $hash = (Get-FileHash "dist/$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Out-File -Encoding ascii "dist/$stage.zip.sha256"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ekos-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # RFC 0185 — the full package per target: the binary from `build`, a pinned standalone Python,
  # the console's wheels for that platform, the console and its built UI, the setup starters.
  # Every target is assembled here on Linux; only the binary had to be built on its own OS.
  package:
    name: Full package ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          # No x86_64-apple-darwin: cryptography (50+, which the console needs) publishes no
          # wheels for Intel macOS, and the package is built with --only-binary. Intel Macs get
          # the command-only archive; install.sh falls back to it on its own.
          - x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download this target's binary
        uses: actions/download-artifact@v7
        with:
          name: ekos-${{ matrix.target }}
          path: bare

      - name: Assemble
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || version="dev"
          cd bare
          if [ -f "ekos-${version}-${{ matrix.target }}.zip" ]; then
            python3 -m zipfile -e "ekos-${version}-${{ matrix.target }}.zip" .
            bin="$PWD/ekos-${version}-${{ matrix.target }}/ekos.exe"
          else
            tar -xzf "ekos-${version}-${{ matrix.target }}.tar.gz"
            bin="$PWD/ekos-${version}-${{ matrix.target }}/ekos"
          fi
          cd ..
          mkdir -p dist
          archive="$(scripts/package-full.sh "${{ matrix.target }}" "$bin" dist "$version" | tail -1)"
          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          rm -rf "dist/ekos-${version}-${{ matrix.target }}-full"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ekos-full-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # Microsoft Store package. MSIX, unsigned: Partner Center signs it during certification, so no
  # certificate lives in this repo or its secrets. Built from the same `ekos.exe` the `build` job
  # put in the zip — one binary, two channels. Uploaded as a workflow artifact for a manual
  # Partner Center submission; deliberately NOT attached to the GitHub Release (see `release`).
  msix:
    name: Microsoft Store package (MSIX)
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Download the Windows binary
        uses: actions/download-artifact@v7
        with:
          name: ekos-x86_64-pc-windows-msvc
          path: bare

      - name: Pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Store versions are X.Y.Z.0. A tag gives X.Y.Z (anything after '-' dropped, so
          # v1.5.0-rc1 packs as 1.5.0.0); a manual run uses the workspace version.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $semver = ($env:GITHUB_REF_NAME -replace '^v','') -replace '-.*$',''
            $zipver = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $m = Select-String -Path ekos/Cargo.toml -Pattern '^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1
            $semver = $m.Matches[0].Groups[1].Value
            $zipver = 'dev'
          }
          if ($semver -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "cannot derive a Store version from '$semver'" }
          $msixver = "$semver.0"
          Write-Host "MSIX version: $msixver"

          $zip = "bare/ekos-$zipver-x86_64-pc-windows-msvc.zip"
          Expand-Archive $zip -DestinationPath bare/x
          $exe = Get-ChildItem bare/x -Recurse -Filter ekos.exe | Select-Object -First 1

          New-Item -ItemType Directory -Force -Path pkg/Assets | Out-Null
          Copy-Item $exe.FullName pkg/
          Copy-Item packaging/msix/Assets/* pkg/Assets/
          (Get-Content packaging/msix/AppxManifest.xml -Raw) -replace '__VERSION__', $msixver |
            Set-Content -Encoding utf8 pkg/AppxManifest.xml

          # A manifest still holding the placeholders would fail Store upload with an opaque
          # identity error. A manual run fails here with the reason; a tag only warns and packs
          # nothing, so a release is never held up by the Store package.
          if (Select-String -Path pkg/AppxManifest.xml -Pattern 'REPLACE_WITH|REPLACE-WITH' -Quiet) {
            $why = 'packaging/msix/AppxManifest.xml still has placeholder identity values — copy them from Partner Center → Product identity'
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              Write-Host "::warning::$why; no MSIX built"
              exit 0
            }
            throw $why
          }

          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw 'makeappx.exe not found in the Windows SDK' }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $makeappx.FullName pack /d pkg /p "dist/ekos-$msixver-x64.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed ($LASTEXITCODE)" }

      # Smoke test: install the package as a user would get it, then run the `ekos` alias. Signed
      # here with a throwaway self-signed certificate only so Windows will install it; the Store
      # re-signs the unsigned .msix we upload (the one in dist/ is never touched).
      # PowerShell does not stop on a failing program, so every `ekos` call goes through `Ekos`,
      # which throws on a non-zero exit. `sql check` exits 0 with findings, so its output is read.
      - name: Install and smoke-test the MSIX
        if: hashFiles('dist/*.msix') != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Ekos {
            & $script:ekos @args
            if ($LASTEXITCODE -ne 0) { throw "ekos $($args -join ' ') failed ($LASTEXITCODE)" }
          }

          $msix = Get-ChildItem dist/*.msix | Select-Object -First 1
          $test = "$env:RUNNER_TEMP\ekos-test.msix"
          Copy-Item $msix.FullName $test

          [xml]$m = Get-Content packaging/msix/AppxManifest.xml
          $publisher = $m.Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
                    -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My `
                    -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\t.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\t.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $test
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }

          Add-AppxPackage -Path $test
          $installed = Get-AppxPackage -Name $m.Package.Identity.Name
          if (-not $installed) { throw "the package $($m.Package.Identity.Name) is not installed" }
          $installed | Format-List Name, Version, InstallLocation

          # The alias is a zero-byte ekos.exe in WindowsApps that Windows creates for the package.
          # Run it by its full path: on the runner `Get-Command` did not find it although the file
          # was there. If it is missing, warn and run the package's own ekos.exe, so the binary
          # that ships is still the one tested.
          $apps = "$env:LOCALAPPDATA\Microsoft\WindowsApps"
          $aliasPath = Join-Path $apps 'ekos.exe'
          for ($i = 0; $i -lt 10 -and -not (Test-Path $aliasPath); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $aliasPath) {
            $script:ekos = $aliasPath
            Write-Host "testing through the execution alias $aliasPath"
          } else {
            Get-ChildItem $apps -ErrorAction SilentlyContinue | Format-Table Name, Length
            Write-Host "::warning::the ekos execution alias was not created on this runner; testing the package's ekos.exe directly"
            $script:ekos = Join-Path $installed.InstallLocation 'ekos.exe'
            if (-not (Test-Path $script:ekos)) { throw "no ekos.exe in $($installed.InstallLocation)" }
          }

          Ekos --version

          # A tiny project: one SQL file, the full pipeline, then a query, an SQL check and MCP.
          $p = "$env:RUNNER_TEMP\proj"; New-Item -ItemType Directory $p | Out-Null; Set-Location $p
          "CREATE TABLE customers (id INT PRIMARY KEY, name TEXT);`nCREATE TABLE orders (id INT PRIMARY KEY, customer_id INT REFERENCES customers(id), total NUMERIC);" |
            Set-Content schema.sql
          Ekos init
          foreach ($step in 'build','recover','resolve','compile','commit','status','coverage','doctor') {
            Write-Host "::group::ekos $step"; Ekos $step; Write-Host '::endgroup::'
          }
          $found = Ekos query find orders | Out-String
          Write-Host $found
          if ($found -notmatch '\borders\b') { throw 'query find did not return the orders table' }
          # A file, not a pipe: text piped into `Ekos` (a PowerShell function) never reaches the
          # program's stdin — the first run's check saw an empty query.
          'SELECT o.total_amount FROM orders o' | Set-Content q.sql
          $check = Ekos sql check q.sql --dialect postgres | Out-String
          Write-Host $check
          if ($check -notmatch 'L001') { throw 'sql check did not report the unknown column (L001)' }

          # MCP over stdio: send initialize, expect a JSON-RPC result back.
          $init = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}'
          $out = $init | & $script:ekos mcp serve 2>$null | Select-Object -First 1
          Write-Host $out
          if ($out -notmatch '"result"') { throw 'MCP initialize got no result' }
          # The pipeline above stops `ekos mcp serve` after its first line; that exit code is not ours.
          exit 0

      - name: Upload
        if: hashFiles('dist/*.msix') != ''
        uses: actions/upload-artifact@v7
        with:
          name: store-msix-x64
          path: dist/*.msix
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The only job in this workflow that writes anything: `gh release create` creates the release
    # and uploads its assets. `id-token` + `attestations` are what the provenance step below needs
    # (a short-lived OIDC token to sign with, and the right to store the attestation).
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      # `pattern`: only the `ekos-*` archives belong in the release. The `msix` job's unsigned
      # Store package (artifact `store-msix-*`) runs in parallel and must not be swept in — it
      # cannot be installed outside the Store, and it carries no checksum file.
      - name: Download every target's artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: ekos-*
          merge-multiple: true

      - name: Build one SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob

          # `./*.sha256`, never a bare `*.sha256`: a file whose name begins with "-" would
          # otherwise be handed to cat/rm as an option (ShellCheck SC2035). Collected into arrays
          # and quoted so a name containing whitespace cannot split either.
          sums=(./*.sha256)
          archives=(./*.tar.gz ./*.zip)

          # Every archive must have contributed a checksum. Without this check a target whose
          # upload half-failed would still be attached to the release, and `install.sh` would
          # then refuse it at the verification step — "not listed in SHA256SUMS" — for a user,
          # after publication, rather than here.
          if [ "${#sums[@]}" -eq 0 ]; then
            echo "no per-target checksum files found in dist/" >&2
            ls -la >&2
            exit 1
          fi
          if [ "${#sums[@]}" -ne "${#archives[@]}" ]; then
            echo "checksum/archive mismatch: ${#sums[@]} checksums, ${#archives[@]} archives" >&2
            ls -la >&2
            exit 1
          fi

          # `sort` rather than `cat`: the glob order is locale-dependent, so this keeps SHA256SUMS
          # byte-identical when the same tag is rebuilt.
          sort "${sums[@]}" > SHA256SUMS
          rm -f "${sums[@]}"

          echo "Release contains ${#archives[@]} archives:"
          cat SHA256SUMS

      # Signed SLSA build provenance for every archive and for SHA256SUMS (Sigstore, keyless;
      # GitHub's own action, so no third-party code runs in this job). Anyone can check a download:
      #   gh attestation verify <archive> --repo alexeyban/EKOS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=CHANGELOG.md
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi

  # RFC 0179 — the production image: the binary, the console API and the built console UI. Built
  # on every run of this workflow and started once, so a Dockerfile that no longer builds or
  # serves fails here; pushed only for a tag.
  image:
    name: Build the image
    runs-on: ubuntu-latest
    # `packages: write` is what lets GITHUB_TOKEN push to ghcr.io. The push step itself is
    # tag-only.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # The runner's own docker. No third-party action: this job holds a token that can publish
      # a package.
      - name: Build
        run: docker build -t ekos:build .

      - name: The container starts, serves, and holds the binary
        run: |
          set -euo pipefail
          docker run -d --name ekos-smoke -p 127.0.0.1:8000:8000 ekos:build
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health
          # The UI is served from the same port.
          curl -fsS http://127.0.0.1:8000/ | grep -qi '<div id="root"'
          docker exec ekos-smoke ekos --version
          # Not root.
          [ "$(docker exec ekos-smoke id -u)" = "1000" ]
          docker rm -f ekos-smoke
          # RFC 0232: what the cloud deployments run is in the image — the git sync, the secrets
          # entrypoint, and an `ekos` built with object storage (without it a restore is refused
          # before any connection; with it, and no network, the connection fails).
          docker run --rm ekos:build test -x /usr/local/bin/ekos-git-sync
          docker run --rm ekos:build test -x /usr/local/bin/ekos-entrypoint
          out=$(docker run --rm --network none ekos:build \
            ekos home restore --from s3://ekos-smoke/x/ --home /tmp/empty 2>&1 || true)
          if printf '%s' "$out" | grep -q 'built without object storage'; then
            echo "::error::the image's ekos was built without the object-storage feature"
            exit 1
          fi

      - name: Push
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ghcr.io names are lowercase; the repository is not.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag ekos:build "$image:$version"
          docker tag ekos:build "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"

  verify:
    name: Verify install.sh
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # The point of this job: a release nobody can install must fail here, not in a user's
      # terminal. It installs the release that was just published, exactly as a reader would.
      - name: Install from the published release
        # No GH_TOKEN: `install.sh` authenticates nothing — it fetches public release assets with
        # plain curl — and EKOS_VERSION means it never even calls the API. Passing a token here
        # exposed a credential to a downloaded-and-executed script for no reason.
        env:
          EKOS_VERSION: ${{ github.ref_name }}
          # RFC 0185: the full package would open the setup wizard and wait for a person.
          EKOS_NO_SETUP: "1"
        run: sh ./install.sh

      - name: The console of the full package starts and serves
        run: |
          set -euo pipefail
          export PATH="$HOME/.ekos/bin:$PATH"
          ekos console start
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/ | grep -qi '<div id="root"'
          ekos console stop

      - name: The binary runs and reports its version
        run: |
          set -euo pipefail
          export PATH="$HOME/.ekos/bin:$PATH"
          ekos --version
          ekos --version | grep -qv '0\.0\.0'

      - name: It works on a real workspace
        run: |
          set -euo pipefail
          export PATH="$HOME/.ekos/bin:$PATH"
          mkdir -p /tmp/ws/db && cd /tmp/ws
          printf 'CREATE TABLE t (id SERIAL PRIMARY KEY);\n' > db/schema.sql
          ekos init --detect --dry-run | grep -q 'default-dialect = "postgres"'

  # The `verify` job above runs on the same `ubuntu-latest` family that built the binary, so it
  # cannot catch a glibc-floor regression — exactly what shipped in v1.0.0 (built on 24.04, needs
  # GLIBC_2.39). This one installs the published release in containers whose glibc DIFFERS from the
  # build host's (2.35): below the floor the gnu build must not start and `install.sh` must fall back
  # to the static musl build; at the floor it must keep the gnu build. A change to either decision
  # (a raised floor, a broken fallback) fails here, before a user sees it.
  verify-glibc:
    name: Install on ${{ matrix.image }}
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.28 (RHEL 8 family, supported to 2029) — below the floor: the gnu build must not
          # start and `install.sh` must fall back to the static musl build. (Debian 11 would do,
          # but it is end-of-life and its mirrors 404, which would break this job for no reason.)
          - image: rockylinux:8
            deps: dnf install -y -q --allowerasing curl ca-certificates tar gzip
            expect_fallback: "yes"
          # glibc 2.34 (RHEL 9 family) — the floor in practice: the v1.3.0 gnu binary needs at most
          # GLIBC_2.34 even though it is built on 22.04 (2.35). Must keep the gnu build.
          - image: rockylinux:9
            deps: dnf install -y -q --allowerasing curl ca-certificates tar gzip
            expect_fallback: "no"
          # glibc 2.35 — the build host's own release: must keep the gnu build.
          - image: ubuntu:22.04
            deps: apt-get update -qq && apt-get install -y -qq curl ca-certificates tar gzip
            expect_fallback: "no"
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install the tools install.sh needs
        run: ${{ matrix.deps }}

      # The checkout action needs git/node on some images; the script is all this job uses.
      - name: Fetch install.sh from the tagged commit
        env:
          REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: curl --proto '=https' --tlsv1.2 -fsSL "https://raw.githubusercontent.com/${REPO}/${REF}/install.sh" -o install.sh

      - name: Install the published release (command only)
        env:
          EKOS_VERSION: ${{ github.ref_name }}
          # The console needs Python and a browser-free wizard; this job is about the binary.
          EKOS_CLI_ONLY: "1"
        run: sh ./install.sh 2>&1 | tee install.log

      - name: The right build was chosen and it runs
        env:
          EXPECT_FALLBACK: ${{ matrix.expect_fallback }}
        run: |
          set -eu
          ekos="$HOME/.ekos/bin/ekos"
          [ -x "$ekos" ] || ekos="$(command -v ekos)"
          "$ekos" --version
          if [ "$EXPECT_FALLBACK" = yes ]; then
            grep -q 'Falling back to the fully static' install.log \
              || { echo "::error::expected the musl fallback on ${{ matrix.image }}"; exit 1; }
          else
            if grep -q 'Falling back' install.log; then
              echo "::error::the gnu build no longer runs at the glibc floor on ${{ matrix.image }}"
              exit 1
            fi
          fi
