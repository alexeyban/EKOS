name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Local work lands with `[skip ci]`; this runs the whole matrix (web-os included) on demand.
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Declared explicitly rather than inherited. With no `permissions:` key at all, every job gets
# the repository's *default* GITHUB_TOKEN scopes — a repository setting, invisible from here, and
# one that silently widens every workflow the day it is changed. This workflow also runs on
# `pull_request`, so the token is exposed to code from a branch that has not been reviewed yet.
# Nothing in any of these four jobs writes to the repository: they check out, build, test and
# upload an artifact (which uses the Actions runtime token, not this one).
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ekos/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ekos/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (all crates)
        working-directory: ekos
        run: cargo build --workspace --locked

      - name: Test (unit + integration)
        working-directory: ekos
        run: cargo test --workspace

      - name: Clippy (no warnings, including test code)
        working-directory: ekos
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        working-directory: ekos
        run: cargo fmt --check

      # RFC 0232: the container image is built with `object-storage`; a stock build is not.
      - name: Clippy + tests with object storage (the image's build)
        working-directory: ekos
        run: |
          cargo clippy -p ekos -p ekos-segment-backend --features ekos/object-storage,ekos-segment-backend/object-store --all-targets -- -D warnings
          cargo test -p ekos --features object-storage --lib home_remote
          cargo test -p ekos --features object-storage --test home_backup object_storage

  deploy:
    # RFC 0232: the cloud deployments. Terraform modules for Azure, Google Cloud and AWS, the
    # Helm chart, and the scripts the image runs there (git sync, secrets entrypoint).
    name: Deploy (Terraform, Helm, scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive deploy/terraform

      - name: terraform validate (every example, every module)
        run: |
          set -e
          for dir in deploy/terraform/examples/* deploy/terraform/modules/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: terraform test (each module planned with mocked providers, no account)
        run: |
          set -e
          for dir in deploy/terraform/modules/azure deploy/terraform/modules/gcp deploy/terraform/modules/aws; do
            echo "::group::$dir"
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done

      - name: helm lint + template
        run: |
          helm lint deploy/helm/ekos
          helm template ekos deploy/helm/ekos >/dev/null
          helm template ekos deploy/helm/ekos \
            --set gitSync.enabled=true --set 'gitSync.repos[0]=shop=https://github.com/acme/shop.git' \
            --set csi.console.enabled=true --set csi.console.provider=aws \
            --set persistence.storageClass=ekos-gp3 --set persistence.createStorageClass.enabled=true \
            --set persistence.createStorageClass.provisioner=ebs.csi.eks.amazonaws.com \
            --set ingress.enabled=true --set ingress.host=ekos.example.com >/dev/null
          # The ingress presets the Terraform modules turn on (GKE, EKS Auto Mode).
          helm template ekos deploy/helm/ekos --set ingress.enabled=true --set ingress.host=ekos.example.com \
            --set ingress.gke.managedCertificate=true --set ingress.gke.staticIpName=ekos-ingress \
            | grep -q 'kind: ManagedCertificate'
          helm template ekos deploy/helm/ekos --set ingress.enabled=true --set ingress.host=ekos.example.com \
            --set ingress.gke.internal=true --set ingress.tlsSecretName=ekos-tls \
            | grep -q 'kubernetes.io/ingress.class: gce-internal'
          helm template ekos deploy/helm/ekos --set ingress.enabled=true --set ingress.host=ekos.example.com \
            --set ingress.eksAlb.enabled=true --set ingress.eksAlb.scheme=internal \
            --set ingress.eksAlb.certificateArn=arn:aws:acm:eu-west-1:123456789012:certificate/x \
            | grep -q 'controller: eks.amazonaws.com/alb'
          # A preset never drops the operator's own annotations.
          helm template ekos deploy/helm/ekos --set ingress.enabled=true --set ingress.host=ekos.example.com \
            --set ingress.gke.managedCertificate=true --set 'ingress.annotations.example\.com/team=data' \
            | grep -q 'example.com/team: data'

      - name: scripts (git sync, entrypoint, wiki snapshot)
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/integration/target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('tests/integration/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-integration-

      - name: Test
        working-directory: tests/integration
        run: cargo test

      - name: Clippy (no warnings, including test code)
        working-directory: tests/integration
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        working-directory: tests/integration
        run: cargo fmt --check

  web:
    name: Web console
    runs-on: ubuntu-latest
    # A hung test once held this job for an hour with no output (pytest's progress is buffered on
    # a pipe). Stop well before GitHub's six hours.
    timeout-minutes: 45
    # The console's supported Python. A runner's default can be newer (macos-14 moved to Homebrew
    # 3.14), and fa2-modified ships wheels for 3.12/3.13 only, so `--no-build` would refuse it.
    env:
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ekos/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ekos/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build ekos (for the live MCP-client test)
        working-directory: ekos
        run: cargo build --release -p ekos --locked

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Sync API deps
        working-directory: web/api
        # Wheels only (--no-build): nothing is built from a source distribution, not even this
        # project, which pytest imports from the source tree instead (pyproject `pythonpath`).
        run: uv sync --frozen --no-build --no-install-project

      - name: Ruff (lint + format)
        working-directory: web/api
        run: |
          uv run --no-sync --no-build ruff check .
          uv run --no-sync --no-build ruff format --check .

      - name: Pytest (unit + live MCP)
        working-directory: web/api
        # -v names each test as it runs; faulthandler prints every thread's stack when one test
        # takes over 5 minutes, so a hang shows where it is.
        run: uv run --no-sync --no-build pytest -v -o faulthandler_timeout=300
        env:
          EKOS_BIN: ${{ github.workspace }}/ekos/target/release/ekos

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install UI deps
        working-directory: web/ui
        # --ignore-scripts: verified locally that this dependency tree's only lifecycle script
        # (esbuild's postinstall) isn't needed — esbuild resolves its platform binary through a
        # normal optionalDependencies package, not the script, so the build still succeeds.
        run: npm ci --ignore-scripts

      - name: Test UI
        working-directory: web/ui
        run: npm test

      - name: Typecheck + build UI
        working-directory: web/ui
        run: |
          npm run typecheck
          npm run build

  # RFC 0184 §4: the console ships to Windows and macOS (RFC 0185). Its API tests on both, with
  # a real `ekos` binary. Informational until the first green run: nothing has run the console
  # on either system before, so the first results are expected to find faults, not gate merges.
  web-os:
    name: Web console API (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    # The console's supported Python. A runner's default can be newer (macos-14 moved to Homebrew
    # 3.14), and fa2-modified ships wheels for 3.12/3.13 only, so `--no-build` would refuse it.
    env:
      UV_PYTHON: "3.12"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ekos/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ekos/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build ekos
        working-directory: ekos
        run: cargo build --release -p ekos --locked

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Sync API deps
        working-directory: web/api
        run: uv sync --frozen --no-build --no-install-project

      - name: Pytest
        working-directory: web/api
        shell: bash
        run: |
          bin="$GITHUB_WORKSPACE/ekos/target/release/ekos"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          EKOS_BIN="$bin" uv run --no-sync --no-build pytest -v -o faulthandler_timeout=300

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            benchmark/target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('benchmark/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-

      - name: Run benchmarks
        working-directory: benchmark
        run: cargo bench

      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: criterion-report
          path: benchmark/target/criterion
