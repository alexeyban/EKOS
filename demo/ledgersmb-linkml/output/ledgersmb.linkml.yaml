      ekos_suggested_close_mappings: schema:Product
  Transactions:
    description: |-
      This table provides referential integrity between AR, AP, GL tables on one
      hand and acc_trans on the other, pending the refactoring of those tables.  It
      also is used to provide discretionary locking of financial transactions across
      database connections, for example in batch payment workflows.
    attributes:
      id:
        range: integer
        required: true
        identifier: true
        annotations:
          ekos_sql_type: INT
      table_name:
        range: string
        annotations:
          ekos_sql_type: TEXT
      locked_by:
        range: integer
        description: |-
          This should only be used in pessimistic locking measures as required by large
          batch work flows.
        annotations:
          ekos_sql_type: INT
      approved:
        range: boolean
        annotations:
          ekos_sql_type: BOOL
      approved_by:
        range: integer
        annotations:
          ekos_sql_type: INT
      approved_at:
        range: datetime
        annotations:
          ekos_sql_type: TIMESTAMP
    annotations:
      ekos_table: transactions
      ekos_status: observed
  Yearend:
    description: |-
      An extension to the journal_entry table to track transactionsactions which close out
      the books at yearend.
    attributes:
