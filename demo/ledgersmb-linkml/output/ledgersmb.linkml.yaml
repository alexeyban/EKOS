        range: integer
        annotations:
          ekos_sql_type: INT
      income_accno_id:
        range: integer
        annotations:
          ekos_sql_type: INT
      expense_accno_id:
        range: integer
        annotations:
          ekos_sql_type: INT
      returns_accno_id:
        range: integer
        annotations:
          ekos_sql_type: INT
      bin:
        range: string
        description: Text identifier for where a part is stored.
        annotations:
          ekos_sql_type: TEXT
      obsolete:
        range: boolean
        annotations:
          ekos_sql_type: BOOL
