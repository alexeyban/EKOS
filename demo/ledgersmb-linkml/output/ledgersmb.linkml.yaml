        range: decimal
        annotations:
          ekos_sql_type: NUMERIC
      onhand:
        range: decimal
        annotations:
          ekos_sql_type: NUMERIC
      notes:
        range: string
        annotations:
          ekos_sql_type: TEXT
      makemodel:
        range: boolean
        annotations:
