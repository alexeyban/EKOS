# EKOS web console — Phase 0 skeleton (RFC 0128 §3.5).
#
# Prerequisite: build the release binary first —
#   (cd ekos && cargo build --release -p ekos)
#
# Then, from web/:
#   EKOS_WS=/abs/path/to/a/compiled/workspace docker compose up
#
# The console does NOT run `ekos mcp serve --tcp` from Compose — per RFC 0127 §11 it will spawn
# one per registered workspace itself (Phase 1). For the skeleton, start one by hand:
#   printf 'dev-mcp-token\n' > /tmp/ekos-mcp-token
#   ekos mcp serve --workspace "$EKOS_WS" --tcp 127.0.0.1:7331 --tcp-token-file /tmp/ekos-mcp-token
# and point EKOS_CONSOLE_WORKSPACES_JSON at it.

services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      EKOS_CONSOLE_CONSOLE_TOKEN: ${CONSOLE_TOKEN:-dev-console-token}
      EKOS_MCP_TOKEN: ${EKOS_MCP_TOKEN:-dev-mcp-token}
      EKOS_CONSOLE_WORKSPACES_JSON: >-
        [{"id":"self","name":"workspace","path":"/workspace",
          "mcp_host":"host.docker.internal","mcp_port":7331}]
      EKOS_CONSOLE_DEV_ORIGIN: http://localhost:5173
      EKOS_BIN: /usr/local/bin/ekos
    volumes:
      - ../ekos/target/release/ekos:/usr/local/bin/ekos:ro
      - ${EKOS_WS:-../.}:/workspace:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    image: node:20-slim
    working_dir: /ui
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://api:8000
    volumes:
      - ./ui:/ui
    depends_on:
      - api
