# EKOS web console — dev-convenience Compose file (not a production deployment manifest: the UI
# service runs Vite's own dev server, not a built static bundle).
#
# Prerequisite: build the release binary first —
#   (cd ekos && cargo build --release -p ekos)
#
# Then, from web/:
#   EKOS_WS=/abs/path/to/a/compiled/workspace docker compose up
#
# No manual `ekos mcp serve` step needed — the console's own McpSupervisor (RFC 0129) spawns and
# restarts one `ekos mcp serve --tcp` per registered workspace itself, on a dynamically-picked
# port, using the `ekos` binary bind-mounted below. `EKOS_CONSOLE_WORKSPACES_JSON` only *seeds* the
# workspace registry on first start (its `mcp_host`/`mcp_port` fields, if present, are ignored —
# see `app/settings.py::WorkspaceSeed`'s own docstring); the seed here carries none.
#
# Read-only by default: set WRITE_TOKEN to enable the write role (running commands, scheduling) —
# unset, this Compose config only ever grants the read role, matching the API's own
# never-grant-write-when-unset default in token mode.

services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      EKOS_CONSOLE_CONSOLE_TOKEN: ${CONSOLE_TOKEN:-dev-console-token}
      EKOS_CONSOLE_CONSOLE_WRITE_TOKEN: ${WRITE_TOKEN:-}
      EKOS_CONSOLE_SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      EKOS_CONSOLE_WORKSPACES_JSON: >-
        [{"id":"self","name":"workspace","path":"/workspace"}]
      EKOS_CONSOLE_DEV_ORIGIN: http://localhost:5173
      EKOS_BIN: /usr/local/bin/ekos
    volumes:
      - ../ekos/target/release/ekos:/usr/local/bin/ekos:ro
      - ${EKOS_WS:-../.}:/workspace:ro

  ui:
    image: node:20-slim
    working_dir: /ui
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://api:8000
    volumes:
      - ./ui:/ui
    depends_on:
      - api
