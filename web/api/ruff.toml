target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# ASYNC230 / ASYNC240: the console does small, local-filesystem operations inline in async code —
# a ~64-byte token file, `Path.is_dir()`, appending a run-log line, reading `.ekos/query-log.jsonl`.
# The blocking cost is sub-millisecond; a threadpool hop would cost more. Same tradeoff as the sync
# SQLModel session in `models.py`. The heavy I/O (running `ekos`) goes through
# `create_subprocess_exec` and never blocks the loop.
ignore = ["ASYNC230", "ASYNC240"]

[lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: these calls in argument defaults are intentional.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
]

[lint.per-file-ignores]
"tests/*" = ["B011"]
