target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# ASYNC240: the console does small, local-filesystem operations (a ~64-byte token file, a
# `Path.is_dir()` check, reading `.ekos/query-log.jsonl`) inline in async handlers. The blocking
# cost is sub-millisecond; a threadpool hop would cost more. Same tradeoff as the sync SQLModel
# session in `models.py`. Phase 3's job runner, which does heavy I/O, uses `create_subprocess_exec`
# and never blocks.
ignore = ["ASYNC240"]

[lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: these calls in argument defaults are intentional.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
]

[lint.per-file-ignores]
"tests/*" = ["B011"]
