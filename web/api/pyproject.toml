[project]
name = "ekos-console-api"
version = "0.1.0"
description = "EKOS web console — FastAPI backend (RFC 0127 / RFC 0128 Phase 0 skeleton)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "tomlkit>=0.13",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "networkx>=3.6.1",
    "fa2-modified>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=xml:coverage.xml --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
