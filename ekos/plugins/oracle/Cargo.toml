[package]
name = "ekos-plugin-oracle"
description = "RFC 0211 — live Oracle catalog observer: one artifact per catalog object, read through ekos-ora-live"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
# Passes through to ekos-ora-live: the driver, off by default (RFC 0211 §3.2).
oracle = ["ekos-ora-live/oracle"]

[dependencies]
ekos-common.workspace = true
ekos-ora-live.workspace = true
ekos-observation-sdk.workspace = true
ekos-artifact.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
