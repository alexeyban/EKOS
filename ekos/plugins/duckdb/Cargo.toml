[package]
name = "ekos-plugin-duckdb"
description = "RFC 0259 — DuckDB files, read-only: the text-to-SQL probe and the live catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
# The bundled DuckDB engine (a C++ build of several minutes), off by default like `oracle`: without
# it every connection attempt fails with a message saying so (RFC 0259 §3.1).
duckdb = ["dep:duckdb"]

[dependencies]
ekos-common.workspace = true
ekos-observation-sdk.workspace = true
ekos-sql-dialect-sdk.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
sqlparser.workspace = true
# Pinned to DuckDB 1.5.6 (crate 1.10506.1): the marts are written by DuckDB 1.5.x, and the file
# format must be readable.
duckdb = { workspace = true, optional = true }

[dev-dependencies]
ekos-migrate-validate.workspace = true
tempfile = "3"
