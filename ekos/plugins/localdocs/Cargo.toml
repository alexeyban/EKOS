[package]
name = "ekos-plugin-localdocs"
description = "Local document observer plugin — PDF/DOCX/XLSX/CSV/PPTX text, tables, and image OCR (RFC 0023, RFC 0253)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
ekos-common.workspace = true
ekos-observation-sdk.workspace = true
ekos-artifact.workspace = true
async-trait.workspace = true
walkdir.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true
lopdf = "0.44"
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree.workspace = true
tempfile = "3"
html2text = "0.17"
mail-parser = "0.11"
# RFC 0253: XLSX reader (pure Rust, read-only, zip 9 like the DOCX reader) and CSV.
calamine = { version = "0.38", default-features = false }
csv = "1.4"

[dev-dependencies]
tempfile = "3"
