[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/kir",
    "crates/artifact",
    "crates/compiler-core",
    "crates/compiler-sdk",
    "crates/scheduler",
    "crates/observation-sdk",
    "crates/sql-dialect-sdk",
    "crates/segment-backend",
    "crates/cluster",
    "crates/ledger",
    "crates/distributed",
    "crates/runtime",
    "crates/simulation",
    "crates/identity",
    "crates/recovery",
    "crates/ekl",
    "crates/semantic",
    "crates/marketing",
    "crates/docs-gen",
    "crates/dbt-gen",
    "crates/session",
    "crates/cli",
    "crates/evals",
    "crates/demo-server",
    "plugins/file",
    "plugins/localdocs",
    "plugins/git",
    "plugins/salesforce",
    "plugins/sap",
    "plugins/oracle",
    "plugins/fabric",
    "plugins/snowflake",
    "plugins/clickhouse",
    "plugins/crypto",
    "plugins/github",
    "plugins/treasury",
    "plugins/governance",
    "plugins/confluence",
    "plugins/pentaho",
    "plugins/python",
    "plugins/rust",
    "plugins/elixir",
    "plugins/perl",
    "plugins/javascript",
    "plugins/sql-dialect-mysql",
    "plugins/sql-dialect-postgres",
    "plugins/sql-dialect-snowflake",
    "plugins/sql-dialect-databricks",
    "plugins/sql-dialect-mssql",
    "plugins/sql-dialect-clickhouse",
    "crates/clickhouse-query",
]

[workspace.package]
version = "1.0.1"
edition = "2024"
authors = ["alexeyban"]
license = "MIT"
# RFC 0153 — release metadata. `repository` and `description` are also what crates.io requires
# on every crate, so having them correct here is a prerequisite for the deferred publish (see
# the RFC's §6 for the ordering and the blockers). No `readme` key: its path resolves relative
# to each *member* crate, and a file outside a crate's own directory is not included in
# `cargo package` — so a workspace-level value here would be wrong for every member. It belongs
# per-crate, as part of the deferred crates.io work.
description = "EKOS — a compiler for enterprise knowledge: observes source systems, compiles them through deterministic passes into a canonical knowledge model, and serves it to AI agents over MCP with evidence for every conclusion."
repository = "https://github.com/alexeyban/EKOS"
homepage = "https://alexeyban.github.io/EKOS/"
keywords = ["knowledge", "compiler", "mcp", "ai", "ledger"]
categories = ["development-tools", "command-line-utilities"]
# The toolchain `rust-toolchain.toml` pins. Kept in step with it deliberately: this is the
# contract for anyone building from source, that file is what CI and releases actually use.
rust-version = "1.98"

[workspace.dependencies]
# Internal crates. `version` alongside `path` is required to publish: cargo uses the path for
# local builds and strips it on publish, leaving the registry version. Keeping every internal
# version here — and nowhere else — means a release bumps this one block, not 40 manifests.
ekos-common                        = { path = "crates/common", version = "1.0.1" }
ekos                               = { path = "crates/cli", version = "1.0.1" }
ekos-artifact                      = { path = "crates/artifact", version = "1.0.1" }
ekos-clickhouse-query              = { path = "crates/clickhouse-query", version = "1.0.1" }
ekos-cluster                       = { path = "crates/cluster", version = "1.0.1" }
ekos-compiler-core                 = { path = "crates/compiler-core", version = "1.0.1" }
ekos-dbt-gen                       = { path = "crates/dbt-gen", version = "1.0.1" }
ekos-distributed                   = { path = "crates/distributed", version = "1.0.1" }
ekos-docs-gen                      = { path = "crates/docs-gen", version = "1.0.1" }
ekos-ekl                           = { path = "crates/ekl", version = "1.0.1" }
ekos-evals                         = { path = "crates/evals", version = "1.0.1" }
ekos-identity                      = { path = "crates/identity", version = "1.0.1" }
ekos-kir                           = { path = "crates/kir", version = "1.0.1" }
ekos-ledger                        = { path = "crates/ledger", version = "1.0.1" }
ekos-marketing                     = { path = "crates/marketing", version = "1.0.1" }
ekos-observation-sdk               = { path = "crates/observation-sdk", version = "1.0.1" }
ekos-plugin-clickhouse             = { path = "plugins/clickhouse", version = "1.0.1" }
ekos-plugin-confluence             = { path = "plugins/confluence", version = "1.0.1" }
ekos-plugin-crypto                 = { path = "plugins/crypto", version = "1.0.1" }
ekos-plugin-elixir                 = { path = "plugins/elixir", version = "1.0.1" }
ekos-plugin-file                   = { path = "plugins/file", version = "1.0.1" }
ekos-plugin-git                    = { path = "plugins/git", version = "1.0.1" }
ekos-plugin-github                 = { path = "plugins/github", version = "1.0.1" }
ekos-plugin-governance             = { path = "plugins/governance", version = "1.0.1" }
ekos-plugin-javascript             = { path = "plugins/javascript", version = "1.0.1" }
ekos-plugin-localdocs              = { path = "plugins/localdocs", version = "1.0.1" }
ekos-plugin-pentaho                = { path = "plugins/pentaho", version = "1.0.1" }
ekos-plugin-perl                   = { path = "plugins/perl", version = "1.0.1" }
ekos-plugin-python                 = { path = "plugins/python", version = "1.0.1" }
ekos-plugin-rust                   = { path = "plugins/rust", version = "1.0.1" }
ekos-plugin-sql-dialect-clickhouse = { path = "plugins/sql-dialect-clickhouse", version = "1.0.1" }
ekos-plugin-sql-dialect-databricks = { path = "plugins/sql-dialect-databricks", version = "1.0.1" }
ekos-plugin-sql-dialect-mssql      = { path = "plugins/sql-dialect-mssql", version = "1.0.1" }
ekos-plugin-sql-dialect-mysql      = { path = "plugins/sql-dialect-mysql", version = "1.0.1" }
ekos-plugin-sql-dialect-postgres   = { path = "plugins/sql-dialect-postgres", version = "1.0.1" }
ekos-plugin-sql-dialect-snowflake  = { path = "plugins/sql-dialect-snowflake", version = "1.0.1" }
ekos-plugin-treasury               = { path = "plugins/treasury", version = "1.0.1" }
ekos-recovery                      = { path = "crates/recovery", version = "1.0.1" }
ekos-runtime                       = { path = "crates/runtime", version = "1.0.1" }
ekos-segment-backend               = { path = "crates/segment-backend", version = "1.0.1" }
ekos-semantic                      = { path = "crates/semantic", version = "1.0.1" }
ekos-session                       = { path = "crates/session", version = "1.0.1" }
ekos-simulation                    = { path = "crates/simulation", version = "1.0.1" }
ekos-sql-dialect-sdk               = { path = "crates/sql-dialect-sdk", version = "1.0.1" }

# Async
tokio      = { version = "1", features = ["full"] }
async-trait = "0.1"
futures    = "0.3"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
serde_yaml = "0.9"

# Error handling
thiserror = "2"
anyhow    = "1"

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# IDs
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hashing
sha2 = "0.10"
hex  = "0.4"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
zstd     = "0.13"
tantivy  = "0.22"
memmap2  = "0.9"
# RFC 0104 Phase 1: real cross-process write lock for FactLedger — already a transitive
# dependency via tantivy's own IndexWriter lock, promoted to direct/first-class here.
fs4      = { version = "0.8", features = ["sync"] }

# Filesystem
walkdir = "2"
glob = "0.3"

# Secret/PII pattern matching (RFC 0043)
regex = "1"

# SQL parsing
sqlparser = "0.53"

# XML parsing (Pentaho .ktr/.kjb — RFC 0027 Phase 3)
roxmltree = "0.20"

# Python parsing (RFC 0038/0040 Phase 2) — pure Rust, no C-dependency class (rejected
# tree-sitter-python for the same reason RFC 0031 rejected pg_query)
#
# `default-features = false` + `num-bigint`: the default `malachite-bigint` backend is LGPL-3.0,
# which cannot ship inside a proprietary build (the private `ekos-binary` extension links these
# crates). `num-bigint` is MIT/Apache-2.0 and is the same `BigInt` API. Cargo unifies features
# across the whole graph, so this has to be decided here, not in the downstream workspace.
rustpython-parser = { version = "0.4", default-features = false, features = ["location", "num-bigint"] }
rustpython-ast = { version = "0.4", default-features = false, features = ["location", "num-bigint"] }

# Rust source parsing (RFC 0041) — pure Rust, no C-dependency
syn = { version = "3.0", features = ["full", "visit"] }
# RFC 0088: `span-locations` is required for `Span::start()`/`.end()` to return real line numbers
# outside an actual proc-macro context (`syn::parse_file` on a plain string, this project's own
# use) — without it, every span silently reports line 0 regardless of real source position.
proc-macro2 = { version = "1", features = ["span-locations"] }

# JavaScript/TypeScript source parsing (RFC 0085) — MIT-licensed, native TS/JSX/TSX support in
# one crate with no separate syntax-config setup (unlike swc's split Syntax::Es/Syntax::Typescript
# + SourceMap/Lexer boilerplate), the deciding factor over `swc_ecma_parser` for a bounded,
# "read what's declared" analyzer matching rust_analyzer.rs's/python_analyzer.rs's own scope.
# Pinned to 0.133 — 0.146 (latest at evaluation time) requires rustc 1.95, newer than this
# workspace's 1.93 toolchain; confirmed via `cargo add --dry-run` before committing, not assumed.
oxc_parser    = "=0.133.0"
oxc_allocator = "=0.133.0"
oxc_span      = "=0.133.0"
oxc_ast       = "=0.133.0"

# HTTP client (LLM API calls)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# OAuth 1.0a request signing (RFC 0027 — X/Twitter publishing)
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
percent-encoding = "2"
rand = "0.8"

# .env loading (RFC 0030 — marketing/.env, never overrides already-set env vars)
dotenvy = "0.15"

# HTTP server (RFC 0045 — hosted demo server) — the one new HTTP-framework dependency in the
# workspace; everything else only ever needed an HTTP *client* (reqwest, above)
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }

# Markdown -> static HTML pre-render, offline bake step only (RFC 0045)
pulldown-cmark = "0.12"

# RFC 0153 — the profile releases are built with. Before this existed the workspace had no
# `[profile.release]` at all, so a published binary would have shipped on defaults.
[profile.release]
# The single largest size win for a 34-crate workspace.
strip = "symbols"
# Cross-crate inlining across the whole pipeline. "fat" costs real CI minutes for little gain
# at this size, so "thin" is the deliberate stopping point.
lto = "thin"
# NOT "abort", though it would be a further size win: RFC 0115's TCP transport spawns one OS
# thread per connection and RFC 0113's cluster workers do the same. A panic while serving one
# request must not take down a server that is serving others.
panic = "unwind"
