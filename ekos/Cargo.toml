[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/kir",
    "crates/artifact",
    "crates/compiler-core",
    "crates/compiler-sdk",
    "crates/scheduler",
    "crates/observation-sdk",
    "crates/sql-dialect-sdk",
    "crates/segment-backend",
    "crates/cluster",
    "crates/ledger",
    "crates/runtime",
    "crates/simulation",
    "crates/identity",
    "crates/recovery",
    "crates/ekl",
    "crates/semantic",
    "crates/marketing",
    "crates/docs-gen",
    "crates/dbt-gen",
    "crates/cli",
    "crates/demo-server",
    "plugins/file",
    "plugins/localdocs",
    "plugins/git",
    "plugins/salesforce",
    "plugins/sap",
    "plugins/oracle",
    "plugins/fabric",
    "plugins/snowflake",
    "plugins/clickhouse",
    "plugins/crypto",
    "plugins/github",
    "plugins/confluence",
    "plugins/pentaho",
    "plugins/python",
    "plugins/rust",
    "plugins/elixir",
    "plugins/javascript",
    "plugins/sql-dialect-mysql",
    "plugins/sql-dialect-postgres",
    "plugins/sql-dialect-snowflake",
    "plugins/sql-dialect-databricks",
    "plugins/sql-dialect-mssql",
    "plugins/sql-dialect-clickhouse",
    "crates/clickhouse-query",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["alexeyban"]
license = "MIT"

[workspace.dependencies]
# Internal crates
ekos-common    = { path = "crates/common" }
ekos-kir       = { path = "crates/kir" }
ekos-artifact  = { path = "crates/artifact" }
ekos-compiler-core = { path = "crates/compiler-core" }
ekos-segment-backend = { path = "crates/segment-backend" }
ekos-cluster   = { path = "crates/cluster" }
ekos-ledger    = { path = "crates/ledger" }
ekos-runtime   = { path = "crates/runtime" }
ekos-simulation = { path = "crates/simulation" }
ekos-identity  = { path = "crates/identity" }
ekos-semantic  = { path = "crates/semantic" }
ekos-observation-sdk = { path = "crates/observation-sdk" }
ekos-sql-dialect-sdk = { path = "crates/sql-dialect-sdk" }
ekos-plugin-sql-dialect-mysql = { path = "plugins/sql-dialect-mysql" }
ekos-plugin-sql-dialect-postgres = { path = "plugins/sql-dialect-postgres" }
ekos-plugin-sql-dialect-snowflake = { path = "plugins/sql-dialect-snowflake" }
ekos-plugin-sql-dialect-databricks = { path = "plugins/sql-dialect-databricks" }
ekos-plugin-sql-dialect-mssql = { path = "plugins/sql-dialect-mssql" }
ekos-plugin-sql-dialect-clickhouse = { path = "plugins/sql-dialect-clickhouse" }
ekos-plugin-clickhouse = { path = "plugins/clickhouse" }
ekos-clickhouse-query = { path = "crates/clickhouse-query" }
ekos-recovery       = { path = "crates/recovery" }
ekos-ekl       = { path = "crates/ekl" }
ekos-marketing = { path = "crates/marketing" }
ekos-docs-gen  = { path = "crates/docs-gen" }
ekos-dbt-gen   = { path = "crates/dbt-gen" }
ekos           = { path = "crates/cli" }

# Async
tokio      = { version = "1", features = ["full"] }
async-trait = "0.1"
futures    = "0.3"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
serde_yaml = "0.9"

# Error handling
thiserror = "2"
anyhow    = "1"

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# IDs
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hashing
sha2 = "0.10"
hex  = "0.4"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
zstd     = "0.13"
tantivy  = "0.22"
memmap2  = "0.9"
# RFC 0104 Phase 1: real cross-process write lock for FactLedger — already a transitive
# dependency via tantivy's own IndexWriter lock, promoted to direct/first-class here.
fs4      = { version = "0.8", features = ["sync"] }

# Filesystem
walkdir = "2"
glob = "0.3"

# Secret/PII pattern matching (RFC 0043)
regex = "1"

# SQL parsing
sqlparser = "0.53"

# XML parsing (Pentaho .ktr/.kjb — RFC 0027 Phase 3)
roxmltree = "0.20"

# Python parsing (RFC 0038/0040 Phase 2) — pure Rust, no C-dependency class (rejected
# tree-sitter-python for the same reason RFC 0031 rejected pg_query)
rustpython-parser = "0.4"
rustpython-ast = "0.4"

# Rust source parsing (RFC 0041) — pure Rust, no C-dependency
syn = { version = "3.0", features = ["full", "visit"] }
# RFC 0088: `span-locations` is required for `Span::start()`/`.end()` to return real line numbers
# outside an actual proc-macro context (`syn::parse_file` on a plain string, this project's own
# use) — without it, every span silently reports line 0 regardless of real source position.
proc-macro2 = { version = "1", features = ["span-locations"] }

# JavaScript/TypeScript source parsing (RFC 0085) — MIT-licensed, native TS/JSX/TSX support in
# one crate with no separate syntax-config setup (unlike swc's split Syntax::Es/Syntax::Typescript
# + SourceMap/Lexer boilerplate), the deciding factor over `swc_ecma_parser` for a bounded,
# "read what's declared" analyzer matching rust_analyzer.rs's/python_analyzer.rs's own scope.
# Pinned to 0.133 — 0.146 (latest at evaluation time) requires rustc 1.95, newer than this
# workspace's 1.93 toolchain; confirmed via `cargo add --dry-run` before committing, not assumed.
oxc_parser    = "=0.133.0"
oxc_allocator = "=0.133.0"
oxc_span      = "=0.133.0"
oxc_ast       = "=0.133.0"

# HTTP client (LLM API calls)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# OAuth 1.0a request signing (RFC 0027 — X/Twitter publishing)
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
percent-encoding = "2"
rand = "0.8"

# .env loading (RFC 0030 — marketing/.env, never overrides already-set env vars)
dotenvy = "0.15"

# HTTP server (RFC 0045 — hosted demo server) — the one new HTTP-framework dependency in the
# workspace; everything else only ever needed an HTTP *client* (reqwest, above)
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }

# Markdown -> static HTML pre-render, offline bake step only (RFC 0045)
pulldown-cmark = "0.12"
