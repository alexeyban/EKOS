[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/kir",
    "crates/artifact",
    "crates/compiler-core",
    "crates/compiler-sdk",
    "crates/scheduler",
    "crates/observation-sdk",
    "crates/sql-dialect-sdk",
    "crates/ledger",
    "crates/runtime",
    "crates/identity",
    "crates/recovery",
    "crates/ekl",
    "crates/semantic",
    "crates/marketing",
    "crates/docs-gen",
    "crates/dbt-gen",
    "crates/cli",
    "plugins/file",
    "plugins/localdocs",
    "plugins/git",
    "plugins/salesforce",
    "plugins/sap",
    "plugins/oracle",
    "plugins/fabric",
    "plugins/snowflake",
    "plugins/crypto",
    "plugins/github",
    "plugins/confluence",
    "plugins/pentaho",
    "plugins/sql-dialect-mysql",
    "plugins/sql-dialect-postgres",
    "plugins/sql-dialect-snowflake",
    "plugins/sql-dialect-databricks",
    "plugins/sql-dialect-mssql",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["alexeyban"]
license = "MIT"

[workspace.dependencies]
# Internal crates
ekos-common    = { path = "crates/common" }
ekos-kir       = { path = "crates/kir" }
ekos-artifact  = { path = "crates/artifact" }
ekos-compiler-core = { path = "crates/compiler-core" }
ekos-ledger    = { path = "crates/ledger" }
ekos-runtime   = { path = "crates/runtime" }
ekos-identity  = { path = "crates/identity" }
ekos-semantic  = { path = "crates/semantic" }
ekos-observation-sdk = { path = "crates/observation-sdk" }
ekos-sql-dialect-sdk = { path = "crates/sql-dialect-sdk" }
ekos-plugin-sql-dialect-mysql = { path = "plugins/sql-dialect-mysql" }
ekos-plugin-sql-dialect-postgres = { path = "plugins/sql-dialect-postgres" }
ekos-plugin-sql-dialect-snowflake = { path = "plugins/sql-dialect-snowflake" }
ekos-plugin-sql-dialect-databricks = { path = "plugins/sql-dialect-databricks" }
ekos-plugin-sql-dialect-mssql = { path = "plugins/sql-dialect-mssql" }
ekos-recovery       = { path = "crates/recovery" }
ekos-ekl       = { path = "crates/ekl" }
ekos-marketing = { path = "crates/marketing" }
ekos-docs-gen  = { path = "crates/docs-gen" }
ekos-dbt-gen   = { path = "crates/dbt-gen" }

# Async
tokio      = { version = "1", features = ["full"] }
async-trait = "0.1"
futures    = "0.3"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# Error handling
thiserror = "2"
anyhow    = "1"

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# IDs
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hashing
sha2 = "0.10"
hex  = "0.4"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
zstd     = "0.13"
tantivy  = "0.22"
memmap2  = "0.9"

# Filesystem
walkdir = "2"
glob = "0.3"

# SQL parsing
sqlparser = "0.53"

# XML parsing (Pentaho .ktr/.kjb — RFC 0027 Phase 3)
roxmltree = "0.20"

# HTTP client (LLM API calls)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# OAuth 1.0a request signing (RFC 0027 — X/Twitter publishing)
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
percent-encoding = "2"
rand = "0.8"

# .env loading (RFC 0030 — marketing/.env, never overrides already-set env vars)
dotenvy = "0.15"
