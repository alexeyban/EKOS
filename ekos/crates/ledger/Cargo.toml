[package]
name = "ekos-ledger"
description = "Append-only semantic knowledge ledger (skeleton — SQLite backend)"
version.workspace = true
edition.workspace = true

[dev-dependencies]
tempfile = "3"
# Tests exercise a full SegmentStore round-trip on ObjectStoreBackend (RFC 0113 B2); the lib build
# never enables this feature, so a production `cargo build` doesn't compile `object_store`.
ekos-segment-backend = { workspace = true, features = ["object-store"] }

[dependencies]
ekos-common.workspace = true
ekos-kir.workspace = true
ekos-artifact.workspace = true
ekos-segment-backend.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
zstd.workspace = true
hex.workspace = true
sha2.workspace = true
tantivy.workspace = true
memmap2.workspace = true
fs4.workspace = true
