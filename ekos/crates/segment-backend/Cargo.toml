[package]
name = "ekos-segment-backend"
description = "RFC 0113 — the storage-backend seam for sealed fact-segment objects (local FS / object storage)"
version.workspace = true
edition.workspace = true

[features]
default = []
# Pulls the `object_store` crate + a tokio runtime for `ObjectStoreBackend` (RFC 0111 Distributed
# mode). Off by default so a Local-mode build never compiles it. Includes the real cloud stores
# (S3 / S3-compatible like MinIO, Azure ADLS Gen2) alongside `file://` — "object storage support"
# means actual object storage, not just the local-FS scheme.
object-store = [
    "dep:object_store",
    "dep:tokio",
    "dep:futures",
    "dep:url",
    "object_store/fs",
    "object_store/aws",
    "object_store/azure",
]
# Back-compat aliases — the cloud providers now come with `object-store` itself.
aws = ["object-store"]
azure = ["object-store"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
object_store = { version = "0.14", default-features = false, optional = true }
tokio = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
