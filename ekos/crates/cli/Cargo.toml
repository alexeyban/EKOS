[package]
name = "ekos"
description = "A compiler for enterprise knowledge: observes source code, schemas, Git history and documents, compiles them into an evidence-backed append-only ledger, and serves it to AI agents over MCP"
version.workspace = true
edition.workspace = true
# RFC 0153 — workspace package metadata applies only where a member opts in.
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"

[lib]
name = "ekos"
path = "src/lib.rs"

[[bin]]
name = "ekos"
path = "src/bin/ekos.rs"

[features]
default = []
# RFC 0113 B4 — lets `ekos query-worker` / `ekos gateway` serve partitions that live in object
# storage (S3 / Azure / …). Off by default so a stock build never compiles the `object_store`
# stack; a co-located Local-mode cluster works without it.
distributed = ["ekos-distributed/object-store", "ekos-segment-backend/object-store"]

[dependencies]
ekos-common.workspace = true
ekos-kir.workspace = true
ekos-artifact.workspace = true
ekos-compiler-core.workspace = true
ekos-ledger.workspace = true
ekos-cluster.workspace = true
ekos-distributed.workspace = true
ekos-segment-backend.workspace = true
ekos-runtime.workspace = true
ekos-simulation.workspace = true
ekos-observation-sdk.workspace = true
ekos-recovery.workspace = true
ekos-clickhouse-query.workspace = true
ekos-identity.workspace = true
ekos-ekl.workspace = true
ekos-marketing.workspace = true
ekos-docs-gen.workspace = true
ekos-evals.workspace = true
ekos-session.workspace = true
ekos-dbt-gen.workspace = true
ekos-semantic.workspace = true
ekos-plugin-file.workspace = true
ekos-plugin-git.workspace = true
ekos-plugin-crypto.workspace = true
ekos-plugin-github.workspace = true
ekos-plugin-treasury.workspace = true
ekos-plugin-governance.workspace = true
ekos-plugin-confluence.workspace = true
ekos-plugin-clickhouse.workspace = true
ekos-plugin-localdocs.workspace = true
ekos-plugin-pentaho.workspace = true
ekos-plugin-python.workspace = true
ekos-plugin-rust.workspace = true
ekos-plugin-elixir.workspace = true
ekos-plugin-perl.workspace = true
ekos-plugin-javascript.workspace = true
clap.workspace = true
