[package]
name = "ekos"
description = "Enterprise Knowledge Operating System — CLI"
version.workspace = true
edition.workspace = true

[lib]
name = "ekos"
path = "src/lib.rs"

[[bin]]
name = "ekos"
path = "src/bin/ekos.rs"

[features]
default = []
# RFC 0113 B4 — lets `ekos query-worker` / `ekos gateway` serve partitions that live in object
# storage (S3 / Azure / …). Off by default so a stock build never compiles the `object_store`
# stack; a co-located Local-mode cluster works without it.
distributed = ["ekos-distributed/object-store"]

[dependencies]
ekos-common.workspace = true
ekos-kir.workspace = true
ekos-artifact.workspace = true
ekos-compiler-core.workspace = true
ekos-ledger.workspace = true
ekos-cluster.workspace = true
ekos-distributed.workspace = true
ekos-runtime.workspace = true
ekos-simulation.workspace = true
ekos-observation-sdk.workspace = true
ekos-recovery.workspace = true
ekos-clickhouse-query.workspace = true
ekos-identity.workspace = true
ekos-ekl.workspace = true
ekos-marketing.workspace = true
ekos-docs-gen.workspace = true
ekos-dbt-gen.workspace = true
ekos-semantic = { path = "../../crates/semantic" }
ekos-plugin-file = { path = "../../plugins/file" }
ekos-plugin-git  = { path = "../../plugins/git" }
ekos-plugin-crypto = { path = "../../plugins/crypto" }
ekos-plugin-github = { path = "../../plugins/github" }
ekos-plugin-confluence = { path = "../../plugins/confluence" }
ekos-plugin-clickhouse.workspace = true
ekos-plugin-localdocs = { path = "../../plugins/localdocs" }
ekos-plugin-pentaho = { path = "../../plugins/pentaho" }
ekos-plugin-python = { path = "../../plugins/python" }
ekos-plugin-rust = { path = "../../plugins/rust" }
ekos-plugin-elixir = { path = "../../plugins/elixir" }
ekos-plugin-javascript = { path = "../../plugins/javascript" }
clap.workspace = true
uuid.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
walkdir.workspace = true
chrono.workspace = true
toml.workspace = true
dotenvy.workspace = true

[dev-dependencies]
tempfile = "3"
