[package]
name = "ekos"
description = "A compiler for enterprise knowledge: observes source code, schemas, Git history and documents, compiles them into an evidence-backed append-only ledger, and serves it to AI agents over MCP"
version.workspace = true
edition.workspace = true
# RFC 0153 — workspace package metadata applies only where a member opts in.
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"

[lib]
name = "ekos"
path = "src/lib.rs"

[[bin]]
name = "ekos"
path = "src/bin/ekos.rs"

[features]
default = []
# RFC 0113 B4 — lets `ekos query-worker` / `ekos gateway` serve partitions that live in object
# storage (S3 / Azure / …). Off by default so a stock build never compiles the `object_store`
# stack; a co-located Local-mode cluster works without it.
distributed = ["ekos-distributed/object-store", "ekos-segment-backend/object-store"]
# RFC 0211 — the live Oracle driver (rust-oracle over ODPI-C). Off by default: it needs a C
# compiler to build and Oracle Instant Client at run time. Without it, a `[[databases]]` entry of
# kind `oracle` fails `ekos build` with a message saying so.
oracle = ["ekos-plugin-oracle/oracle"]
# RFC 0232 — `ekos home backup --to <url>` / `ekos home restore <url>`: backups in S3, Azure Blob
# or Google Cloud Storage, authenticated by the machine's cloud identity. Only the `object_store`
# client, never the distributed services (RFC 0113 keeps those out of a stock build). Off by
# default for the install packages; the container image is built with it.
object-storage = ["ekos-segment-backend/object-store", "dep:futures"]

[dependencies]
ekos-common.workspace = true
ekos-kir.workspace = true
ekos-artifact.workspace = true
ekos-compiler-core.workspace = true
ekos-ledger.workspace = true
ekos-cluster.workspace = true
ekos-distributed.workspace = true
ekos-segment-backend.workspace = true
ekos-runtime.workspace = true
ekos-simulation.workspace = true
ekos-observation-sdk.workspace = true
ekos-recovery.workspace = true
ekos-clickhouse-query.workspace = true
ekos-identity.workspace = true
ekos-ekl.workspace = true
ekos-marketing.workspace = true
ekos-docs-gen.workspace = true
ekos-evals.workspace = true
ekos-migrate.workspace = true
ekos-migrate-approval.workspace = true
ekos-migrate-dq.workspace = true
ekos-migrate-logic.workspace = true
ekos-plpgsql.workspace = true
ekos-migrate-report.workspace = true
ekos-migrate-validate.workspace = true
ekos-migrate-target-clickhouse.workspace = true
ekos-pg-live.workspace = true
ekos-session.workspace = true
ekos-dbt-gen.workspace = true
ekos-semantic.workspace = true
ekos-plugin-file.workspace = true
ekos-plugin-git.workspace = true
ekos-plugin-crypto.workspace = true
ekos-plugin-github.workspace = true
ekos-plugin-treasury.workspace = true
ekos-plugin-governance.workspace = true
ekos-plugin-confluence.workspace = true
ekos-plugin-clickhouse.workspace = true
ekos-plugin-oracle.workspace = true
ekos-plugin-localdocs.workspace = true
ekos-plugin-pentaho.workspace = true
ekos-plugin-python.workspace = true
ekos-plugin-rust.workspace = true
ekos-plugin-elixir.workspace = true
ekos-plugin-perl.workspace = true
ekos-plugin-java.workspace = true
ekos-plugin-javascript.workspace = true
clap.workspace = true
uuid.workspace = true
tokio.workspace = true
# RFC 0232: streams a backup to and from object storage (`object-storage` feature only).
futures = { version = "0.3", optional = true }
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
walkdir.workspace = true
tar.workspace = true
zstd.workspace = true
fs4.workspace = true
rusqlite.workspace = true
chrono.workspace = true
toml.workspace = true
toml_edit.workspace = true
dotenvy.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
schemars.workspace = true
reqwest.workspace = true

[dev-dependencies]
tempfile = "3"
# Issue #14: `commands/review_guard.rs` parses `mcp.rs` to resolve imports.
syn = { workspace = true }
proc-macro2 = { workspace = true }
quote = "1"
reqwest = { workspace = true, features = ["blocking"] }
tower = { version = "0.5", features = ["util"] }
