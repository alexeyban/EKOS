# RFC 0261: the EKOS.DEV desktop shell, a separate workspace so Tauri's GTK/WebKitGTK
# dependencies (system development packages) never reach `ekos/` or its CI.
[workspace]
resolver = "3"
members = ["src-tauri"]

# The app ships in the installers (RFC 0261 §2.8): no symbols, as the ekos binary.
[profile.release]
strip = true
lto = "thin"
