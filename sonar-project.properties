# Persisted scanner config so exclusions apply on every run, not just ones that happen to pass
# the right -D flags. organization/projectKey are still passed on the command line; add them here
# too if you want `sonar-scanner` runnable with no flags at all.

# docs/ is generated documentation + RFCs + presentation exports (docs/presentations/examples/,
# docs/generated/), not source code — excluding it drops stale/noisy findings (e.g. duplication
# and missing-SRI warnings on generated example HTML) that don't reflect the actual codebase.
sonar.exclusions=docs/**
