# Persisted scanner config so exclusions apply on every run, not just ones that happen to pass
# the right -D flags. organization/projectKey are still passed on the command line; add them here
# too if you want `sonar-scanner` runnable with no flags at all.

# Explicit, not left to the CLI default. Found live 2026-09-05: once sonar.tests (below) is set,
# the scanner does NOT fall back to "." for sonar.sources on its own — with sonar.sources unset
# and sonar.tests set, indexing dropped to literally the 24 files matching sonar.test.inclusions
# and nothing else (zero of the 237 tracked .rs files, zero of the 26 non-test web/api/app/*.py
# files, zero of the 22 non-test web/ui/src/**/*.tsx files — "24 files indexed" as the *entire*
# project total, confirmed by re-running with -X and reading the indexing log directly). Silent:
# the scan still finishes, uploads, and reports a clean Quality Gate, because a project with (near)
# zero analyzed source obviously has (near) zero issues too. Regression from the same commit that
# added sonar.tests to fix the test-file-coverage problem below — that fix was real, but shipped
# without noticing sonar.sources needed to be pinned alongside it.
sonar.sources=.

# docs/ is generated documentation + RFCs + presentation exports (docs/presentations/examples/,
# docs/generated/), not source code — excluding it drops stale/noisy findings (e.g. duplication
# and missing-SRI warnings on generated example HTML) that don't reflect the actual codebase.
# **/tests/fixtures/** holds deliberately realistic (i.e. imperfect) sample input for the
# recovery-pass analyzers under test — a legacy CHAR-typed SQL schema, an old-style HTML doc, etc.
# Code-quality/best-practice rules don't apply to intentional test data: "fixing" a fixture to be
# well-formed would defeat the point of the test.
# **/demo/** is presentation material, not shipped code, and the same "rules don't apply to
# deliberate content" reasoning as the fixtures above holds for most of it: recorded terminal
# frames, deck-building and screenshot tooling, the session-memory and LedgerSMB walkthroughs. The
# strongest case is
# demo/binary-demo/python-port/: a Python port written to mirror a *decompiled* C# assembly
# statement for statement, so that it can be diffed against the original (RFC 0150). Idiomatic-
# Python rules would push it away from the structure that is the entire point of it.
sonar.exclusions=docs/**,**/tests/fixtures/**,**/demo/**

# All three are report *readers*, not runners: the test suite has to actually run first (with
# coverage enabled) so these files exist — the scanner just imports them.
# - web/api: `pytest` always writes coverage.xml (pyproject.toml addopts).
# - web/ui: `npm run coverage` (vitest, vite.config.ts's `test.coverage`) writes an lcov report.
# - ekos/ (Rust, ~90% of this codebase's lines): `cargo llvm-cov --workspace --lcov
#   --output-path lcov.info`, run from ekos/ — slow (full instrumented rebuild + all 1300+
#   tests), so this one is worth regenerating deliberately before a scan rather than reflexively.
sonar.python.coverage.reportPaths=web/api/coverage.xml
sonar.javascript.lcov.reportPaths=web/ui/coverage/lcov.info
sonar.rust.lcov.reportPaths=ekos/lcov.info

# Without this, Python/TS test files (they live alongside source, not under a dedicated tests/
# root the auto-heuristic reliably picks up — see the scanner's own "sonar.tests is not set"
# warning) get counted as *source* needing coverage. A test file is never covered by another
# test, so every one of them showed up as 100% uncovered "new code" — that's what was actually
# driving the Quality Gate's new_coverage failure, not real untested production code.
# deploy/e2e/ is the deployment end-to-end suite (`run.sh`, `package.sh` drive its Python
# steps against a real image or package): test code, so the same reasoning applies — counted as
# source it was ~600 "uncovered new lines" in the 2026-10-19 gate (79.7% vs 80%).
sonar.tests=web/api/tests,web/ui/src,deploy/e2e
sonar.test.inclusions=web/api/tests/**/*.py,**/*.test.ts,**/*.test.tsx,deploy/e2e/**/*.py

# python:S7503 ("async function uses no async feature") on four functions that are async on
# purpose; each carries its reason in a comment above it. FastAPI runs an async dependency on the
# event loop and a sync one on a thread-pool thread, and the runner/scheduler methods are part of
# an awaited interface. The inline `# NOSONAR(python:S7503)` marks were not honoured by the
# 2026-09-30 analysis, so the exception is stated here, for these files only.
sonar.issue.ignore.multicriteria=asyncdep1,asyncdep2,asyncdep3,asyncdep4
sonar.issue.ignore.multicriteria.asyncdep1.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.asyncdep1.resourceKey=web/api/app/auth.py
sonar.issue.ignore.multicriteria.asyncdep2.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.asyncdep2.resourceKey=web/api/app/deps.py
sonar.issue.ignore.multicriteria.asyncdep3.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.asyncdep3.resourceKey=web/api/app/runner.py
sonar.issue.ignore.multicriteria.asyncdep4.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.asyncdep4.resourceKey=web/api/app/scheduler.py
