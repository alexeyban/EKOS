      parts of the following tables:  acc_trans, ar, ap, gl, transactions.

      Note now all ar/ap transactions are also journal entries.
    attributes:
      id:
        range: integer
        required: true
        identifier: true
        annotations:
          ekos_sql_type: serial
      reference:
        range: string
        required: true
        description: Invoice number or journal entry number.
        annotations:
          ekos_sql_type: TEXT
      description:
        range: string
        annotations:
          ekos_sql_type: TEXT
      locked_by:
        range: integer
        annotations:
          ekos_sql_type: INT
      journal:
        range: integer
        annotations:
          ekos_sql_type: INT
          ekos_enum: JournalEntryJournal
      post_date:
        range: date
        required: true
        annotations:
          ekos_sql_type: DATE
      effective_start:
        range: date
        required: true
        description: |-
          For transactions whose effects are spread out over a period of time, this is
          the effective start date for the transaction.  To be used by add-ons for
          automating adjustments.
        annotations:
          ekos_sql_type: DATE
      effective_end:
        range: date
        required: true
        description: |-
          For transactions whose effects are spread out over a period of time, this is
          the effective end date for the transaction.  To be used by add-ons for
          automating adjustments.
        annotations:
          ekos_sql_type: DATE
      currency:
        range: string
        required: true
        annotations:
          ekos_sql_type: CHAR(3)
      approved:
        range: boolean
        annotations:
          ekos_sql_type: BOOL
      is_template:
        range: boolean
        description: |-
          Set true for template transactions.  Templates can never be approved but can
          be copied into new transactions and are useful for recurrances.
        annotations:
          ekos_sql_type: BOOL
      entered_by:
        range: integer
        required: true
        annotations:
          ekos_sql_type: INT
      approved_by:
        range: integer
        annotations:
          ekos_sql_type: INT
