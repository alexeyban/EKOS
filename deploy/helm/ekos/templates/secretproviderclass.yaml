{{- range $role, $c := dict "console" .Values.csi.console "git-sync" .Values.csi.gitSync }}
{{- if $c.enabled }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "ekos.name" $ }}-{{ $role }}
  labels:
    {{- include "ekos.labels" $ | nindent 4 }}
spec:
  provider: {{ required "csi.*.provider is required" $c.provider }}
  parameters:
    {{- toYaml $c.parameters | nindent 4 }}
{{- end }}
{{- end }}
