# RFC 0244 — BIRD dev, the cleaned "New Dev" release (2025-11-06), SQLite. The leaderboard marks
# results on it as "New Dev". The questions come from Hugging Face at a pinned revision. The
# databases come from BIRD's dev.zip, which holds them in a zip of its own
# (dev_20240627/dev_databases.zip); `prepare` extracts only <db>/<db>.sqlite and
# <db>/database_description/*.csv from it. The archive's question and gold files are never read.
name = "bird-dev"
adapter = "bird"
version = "BIRD dev (New Dev 2025-11-06)"
dialect = "sqlite"
new-dev = true
notes = "birdsql/bird_sql_dev_20251106 @ 3c11fb19; databases dev.zip (Last-Modified 2024-06-29)"

[questions]
file = "dev_20251106.json"
url = "https://huggingface.co/datasets/birdsql/bird_sql_dev_20251106/resolve/3c11fb193e5439b338e23677fa0aae11e8b85db9/data/dev_20251106-00000-of-00001.json"
sha256 = "ffd8018378ddb1a8794753e0a31cfc81862ff7318a5184c22f3dc4ce03a03feb"

[databases]
file = "dev.zip"
url = "https://bird-bench.oss-cn-beijing.aliyuncs.com/dev.zip"
sha256 = "cdd6d19faeb45a23970b98d3ef6c40a87987c95459c2cf12076897a60cf5a630"
inner = "dev_20240627/dev_databases.zip"
prefix = "dev_databases/"

# Dev is an evaluation set here: nothing is tuned on it. Runs use --split all.
[split]
seed = 244
tune-fraction = 0.0
