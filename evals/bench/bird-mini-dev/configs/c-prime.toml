# RFC 0240 §2.4 — cell C-prime. The model route, n and r are the same in every cell.
name = "C-prime"
description = "EKOS pack; no evidence; no value lookup — isolates value lookup"
context = "ekos-pack"
evidence = false
value-lookup = false
few-shot = 0
n = 1
r = 1
max-tokens = 1024
ves-iterations = 3
timeout-seconds = 30

[llm]
provider = "ollama"
model = "qwen2.5-coder:3b"
context-window = 10240
