# RFC 0240 §2.4 — cell C-prime with RFC 0252 §8 data signals; otherwise identical to c-prime.toml. The model route, n and r are the same in every cell.
name = "C-prime-sig"
description = "EKOS pack + RFC 0252 data signals (references and keys found in the data); no evidence; no value lookup"
context = "ekos-pack"
evidence = false
value-lookup = false
few-shot = 0
n = 1
r = 1
max-tokens = 1024
ves-iterations = 3
timeout-seconds = 30
data-signals = true

[llm]
provider = "ollama"
model = "qwen2.5-coder:3b"
context-window = 10240
