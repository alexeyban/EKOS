# RFC 0242 model screen — K2 for a free, data-collecting model (nemotron). BIRD is public, so
# its provider keeping prompts is acceptable here; such a model must never see a client's schema.
# RFC 0242 — K's one revision, from K's tune transcripts: tools were used on 16 of 198 questions,
# and all 5 of the tool-using flips were wrong → right. K2 asks the model to check every compared
# value with find_values, and shows the first clean answer's result once with a check against the
# question (columns, one row per thing asked, form of the values).
name = "K2-free"
description = "K + check literals with find_values + verify the first result once"
context = "ekos-pack"
evidence = false
value-lookup = true
few-shot = 0
n = 1
r = 1
max-tokens = 4096
ves-iterations = 3
timeout-seconds = 30
profiles = true
profile-version = 2
value-lookup-version = 2
prompt = "ekos-v1"
result-checks = false
vary-context = false
strategy = "agent"
verify = true
checks = ["E000", "P001", "P002", "P003", "P004", "P005", "L001", "L003", "L004", "L005", "L006", "L007", "L008"]

[llm]
# OpenCode Zen, Claude Haiku 5.5 ($0.10 / $0.50 per million tokens). Metered: needs --allow-metered.
provider = "zen"
model = "claude-haiku-5-5"
api-key-env = "OPENCODE_API_KEY"
allow-data-collection = true
budget-usd = 1.0

# Free on Zen: a $0 price lets the budget gate run (it refuses a model with no known price).
[llm.prices."nemotron-3.5-super-vl-free"]
input = 0.0
output = 0.0
