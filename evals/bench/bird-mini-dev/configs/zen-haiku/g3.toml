# RFC 0242 — G2's configuration on the ledgers as they are now. G2 was measured before the
# SqlAnalyzerPass v6 fix (COMMENT ON for quoted identifiers), so its pack had no column
# descriptions; these ledgers have them. G3 is the baseline J and K are compared with, and
# G3 vs G2 measures the dictionary descriptions.
name = "G3"
description = "G2 on the current ledgers (column descriptions in the pack)"
context = "ekos-pack"
evidence = false
value-lookup = true
few-shot = 0
n = 1
r = 1
max-tokens = 4096
ves-iterations = 3
timeout-seconds = 30
profiles = true
profile-version = 2
value-lookup-version = 2
prompt = "ekos-v1"
result-checks = true
vary-context = false

[llm]
# OpenCode Zen, Claude Haiku 5.5 ($0.10 / $0.50 per million tokens). Metered: needs --allow-metered.
provider = "zen"
model = "claude-haiku-5-5"
api-key-env = "OPENCODE_API_KEY"
budget-usd = 0.3
