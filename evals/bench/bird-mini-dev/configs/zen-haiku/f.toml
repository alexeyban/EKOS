# RFC 0241 — cell F on OpenCode Zen (Claude Haiku 5.5). Tuned on the tune split only.
name = "F"
description = "E + value lookup v2"
context = "ekos-pack"
evidence = false
value-lookup = true
few-shot = 0
n = 1
r = 1
